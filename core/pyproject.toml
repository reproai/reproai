[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reproai-prep"
version = "0.8.0"
description = "ReproAI Prep: audits and prepares a replication package so it runs from scratch on a clean machine and meets a journal's or a certification service's entry requirements."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Leo Yang Yang" },
    { name = "Yiqing Xu" },
]
keywords = ["replication", "reproducibility", "replication-package", "certification", "static-analysis", "stata", "r", "python"]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://reproai.org"
Repository = "https://github.com/reproai/reproai"
Issues = "https://github.com/reproai/reproai/issues"

[project.optional-dependencies]
validate = ["jsonschema>=4.0"]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[project.scripts]
reproai = "reproai_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reproai_prep = [
    "rules/*.yaml",
    "rules/*.json",
    "venues/*.yaml",
    "venues/*.md",
    "schemas/*.json",
    "style_guide.md",
    "targets/*.yaml",
]
